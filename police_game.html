<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07101e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Policejní akademie: Zátah na lupiče</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            background-color: #07101e;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 100dvh;
        }
        @keyframes police-beacon {
            0%, 100% { box-shadow: -6px 0 20px rgba(37, 99, 235, 0.7), 6px 0 20px rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 6px 0 25px rgba(37, 99, 235, 0.9), -6px 0 25px rgba(239, 68, 68, 0.9); }
        }
        .beacon-active { animation: police-beacon 0.8s infinite ease-in-out; }

        @keyframes robber-sneak {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-4px) rotate(3deg) scale(1.05); }
        }
        .robber-sneak-anim { animation: robber-sneak 1s infinite ease-in-out; }

        @keyframes handcuffs-snap {
            0% { transform: scale(1.5) rotate(-20deg); opacity: 0; }
            50% { transform: scale(0.9) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .handcuffs-anim { animation: handcuffs-snap 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        .police-stripe {
            background: repeating-linear-gradient(-45deg, #003399, #003399 12px, #e5e7eb 12px, #e5e7eb 24px, #eab308 24px, #eab308 36px);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between p-2 sm:p-4 max-w-lg mx-auto">

    <!-- Horní lišta s návratem a hodností -->
    <header class="w-full bg-slate-900/95 border-2 border-blue-600 rounded-2xl p-2.5 sm:p-3 shadow-xl mb-2">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <a href="index.html" class="p-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl text-sm" title="Zpět do menu">
                    🏠
                </a>
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-white flex items-center gap-1.5">
                        POLICEJNÍ ZÁTAH
                        <span class="text-[10px] bg-blue-950 text-blue-300 px-1.5 py-0.2 rounded-full border border-blue-400/40">PČR</span>
                    </h1>
                    <div class="text-[11px] text-yellow-300 font-semibold flex items-center gap-1">
                        <span id="rankBadge" class="text-white bg-slate-800 px-1.5 rounded border border-yellow-500/50">👮 Kadet</span>
                        <span id="thiefCounter" class="text-emerald-400 ml-1">🚨 0</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                <button id="soundToggle" class="p-2 bg-slate-800 border border-slate-700 rounded-xl text-xs active:scale-95" title="Siréna">
                    <span id="soundIcon">🔊</span>
                </button>
                <div class="bg-blue-950/80 border border-blue-500/40 px-2 py-1 rounded-xl text-center">
                    <div class="text-[9px] text-blue-300 uppercase font-bold">Úspěšnost</div>
                    <div id="scoreDisplay" class="text-xs sm:text-sm font-bold text-yellow-300">0 / 0</div>
                </div>
            </div>
        </div>

        <!-- Volba mise a čísel -->
        <div class="mt-2.5 pt-2 border-t border-slate-800 flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold uppercase text-slate-400">Typ mise:</span>
                <div class="inline-flex rounded-lg p-0.5 bg-slate-950 border border-slate-800 text-xs font-bold">
                    <button id="opMultiply" class="op-btn px-2.5 py-1 rounded bg-blue-600 text-white shadow">✖️</button>
                    <button id="opDivide" class="op-btn px-2.5 py-1 rounded text-slate-400">➗</button>
                    <button id="opMixed" class="op-btn px-2.5 py-1 rounded text-slate-400">⚡ Mix</button>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] font-bold uppercase text-slate-400">Prověřovaná čísla:</span>
                    <div class="flex gap-1.5 text-[10px]">
                        <button id="selectAllBtn" class="text-yellow-300">Vše (1-10)</button>
                        <span class="text-slate-600">|</span>
                        <button id="selectBasicBtn" class="text-yellow-300">Základ (2-5)</button>
                    </div>
                </div>
                <div class="grid grid-cols-5 sm:grid-cols-10 gap-1">
                    <button data-num="1" class="num-toggle py-1 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700">1</button>
                    <button data-num="2" class="num-toggle py-1 rounded font-bold text-xs bg-blue-600 text-white border border-yellow-400">2</button>
                    <button data-num="3" class="num-toggle py-1 rounded font-bold text-xs bg-blue-600 text-white border border-yellow-400">3</button>
                    <button data-num="4" class="num-toggle py-1 rounded font-bold text-xs bg-blue-600 text-white border border-yellow-400">4</button>
                    <button data-num="5" class="num-toggle py-1 rounded font-bold text-xs bg-blue-600 text-white border border-yellow-400">5</button>
                    <button data-num="6" class="num-toggle py-1 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700">6</button>
                    <button data-num="7" class="num-toggle py-1 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700">7</button>
                    <button data-num="8" class="num-toggle py-1 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700">8</button>
                    <button data-num="9" class="num-toggle py-1 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700">9</button>
                    <button data-num="10" class="num-toggle py-1 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700">10</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Zásahová zóna -->
    <main class="w-full flex-1 flex flex-col justify-center">
        <div id="exerciseCard" class="w-full relative bg-gradient-to-b from-slate-900 to-slate-950 border-4 border-blue-600 rounded-3xl p-4 shadow-2xl overflow-hidden text-center transition-all">
            <div class="absolute top-0 left-0 right-0 h-2 police-stripe border-b border-black/40"></div>

            <!-- Scéna s lupičem -->
            <div class="h-16 flex items-center justify-center relative mt-1">
                <div id="thiefScene" class="robber-sneak-anim text-5xl select-none transition-transform">🦹‍♂️💰</div>
                <div id="arrestBadge" class="hidden absolute text-5xl handcuffs-anim pointer-events-none">⛓️🚨</div>
            </div>

            <!-- Zadání kódu -->
            <div class="my-2">
                <div class="flex items-center justify-center gap-3 text-4xl sm:text-5xl font-extrabold tracking-wider">
                    <span id="numA" class="text-white">7</span>
                    <span id="operationSign" class="text-yellow-400">×</span>
                    <span id="numB" class="text-white">6</span>
                    <span class="text-slate-500">=</span>
                    <input id="answerInput" type="text" inputmode="none" readonly
                        class="w-20 sm:w-24 py-1 text-center bg-slate-950 border-4 border-blue-400 rounded-2xl text-yellow-300 font-extrabold text-3xl sm:text-4xl outline-none"
                        placeholder="?" maxlength="4">
                </div>
            </div>

            <div id="feedbackText" class="min-h-[24px] text-xs sm:text-sm font-bold flex items-center justify-center gap-1">
                <span class="text-blue-200">Vyřeš kód a nasaď lupiči pouta!</span>
            </div>

            <!-- Numpad -->
            <div class="mt-3 pt-2 border-t border-slate-800">
                <div class="grid grid-cols-3 gap-1.5 max-w-xs mx-auto">
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="1">1</button>
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="2">2</button>
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="3">3</button>
                    
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="4">4</button>
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="5">5</button>
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="6">6</button>
                    
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="7">7</button>
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="8">8</button>
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="9">9</button>
                    
                    <button id="backspaceBtn" class="py-3 bg-red-950 hover:bg-red-900 border border-red-800 text-red-200 rounded-xl font-bold text-lg active:scale-95" title="Smazat">⌫</button>
                    <button class="numpad-btn py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xl shadow active:scale-95" data-key="0">0</button>
                    <button id="submitBtn" class="py-3 bg-blue-500 hover:bg-blue-400 text-white rounded-xl font-black text-xl shadow-lg border-2 border-yellow-400 active:scale-95" title="Zatknout">👮‍♂️</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-1 text-[11px] text-slate-500">
        Policie ČR: Pomáhat a chránit správné počty!
    </footer>

    <script>
        const state = {
            selectedNumbers: new Set([2, 3, 4, 5]),
            mode: 'multiply',
            currentProblem: null,
            lastProblem: null,
            totalSolved: 0,
            correctCount: 0,
            streak: 0,
            soundEnabled: true,
            isLocked: false
        };

        const POLICE_RANKS = [
            { min: 0, title: "Kadet", icon: "👮" },
            { min: 5, title: "Strážmistr", icon: "🛡️" },
            { min: 12, title: "Podporučík", icon: "🚔" },
            { min: 20, title: "Vyšetřovatel", icon: "🕵️‍♂️" },
            { min: 30, title: "Velitel URNA", icon: "⭐" },
            { min: 45, title: "Prezident", icon: "👑" }
        ];

        const THIEF_EMOJIS = ["🦹‍♂️💰", "🦹‍♀️💎", "🏃‍♂️💼", "🥷🪙", "🕵️‍♂️🎒"];
        let synth, sirenSynth, snapSynth, audioInitialized = false;

        function initAudio() {
            if (audioInitialized) return;
            try {
                Tone.start();
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.3 }
                }).toDestination();
                synth.volume.value = -6;

                snapSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.1 }
                }).toDestination();
                snapSynth.volume.value = -2;

                sirenSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.8, release: 0.1 }
                }).toDestination();
                sirenSynth.volume.value = -12;

                audioInitialized = true;
            } catch (e) {}
        }

        function playArrestSound() {
            if (!state.soundEnabled) return;
            initAudio();
            try {
                const now = Tone.now();
                if (snapSynth) snapSynth.triggerAttackRelease("C6", "16n", now);
                if (sirenSynth) {
                    sirenSynth.triggerAttackRelease("A5", "16n", now + 0.08);
                    sirenSynth.triggerAttackRelease("D6", "16n", now + 0.20);
                }
                if (synth) synth.triggerAttackRelease(["E5", "G#5", "B5"], "8n", now + 0.35);
            } catch (e) {}
        }

        function playThiefEscapedSound() {
            if (!state.soundEnabled) return;
            initAudio();
            try {
                if (synth) {
                    const now = Tone.now();
                    synth.triggerAttackRelease("F4", "8n", now);
                    synth.triggerAttackRelease("Db4", "8n", now + 0.15);
                    synth.triggerAttackRelease("C4", "4n", now + 0.30);
                }
            } catch (e) {}
        }

        function playPromotionFanfare() {
            if (!state.soundEnabled) return;
            initAudio();
            try {
                if (synth) {
                    const now = Tone.now();
                    synth.triggerAttackRelease("C5", "16n", now);
                    synth.triggerAttackRelease("E5", "16n", now + 0.1);
                    synth.triggerAttackRelease("G5", "16n", now + 0.2);
                    synth.triggerAttackRelease("C6", "4n", now + 0.3);
                }
            } catch (e) {}
        }

        function generateProblem() {
            const numbers = Array.from(state.selectedNumbers);
            if (numbers.length === 0) {
                numbers.push(2, 3);
                state.selectedNumbers.add(2);
                state.selectedNumbers.add(3);
                updateNumberButtons();
            }

            let type = state.mode === 'mixed' ? (Math.random() < 0.5 ? 'multiply' : 'divide') : state.mode;
            let candidate = null, attempts = 0;

            while (attempts < 60) {
                attempts++;
                const base = numbers[Math.floor(Math.random() * numbers.length)];
                const other = Math.floor(Math.random() * 10) + 1;
                let num1, num2, answer, symbol, key;

                if (type === 'multiply') {
                    const swap = Math.random() < 0.5;
                    num1 = swap ? base : other;
                    num2 = swap ? other : base;
                    answer = num1 * num2;
                    symbol = '×';
                    key = `${num1}*${num2}`;
                } else {
                    const product = base * other;
                    const divisor = Math.random() < 0.5 ? base : other;
                    num1 = product;
                    num2 = divisor;
                    answer = num1 / num2;
                    symbol = ':';
                    key = `${num1}/${num2}`;
                }

                if (state.lastProblem) {
                    if (state.lastProblem.key === key) continue;
                    if (type === 'multiply' && state.lastProblem.symbol === '×') {
                        if (state.lastProblem.num1 === num1 && state.lastProblem.num2 === num2) continue;
                    }
                }

                candidate = { num1, num2, answer, symbol, key };
                break;
            }

            if (!candidate) {
                candidate = { num1: numbers[0], num2: 3, answer: numbers[0] * 3, symbol: '×', key: `${numbers[0]}*3` };
            }
            return candidate;
        }

        const numAEl = document.getElementById('numA');
        const numBEl = document.getElementById('numB');
        const operationSignEl = document.getElementById('operationSign');
        const answerInput = document.getElementById('answerInput');
        const feedbackText = document.getElementById('feedbackText');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const thiefCounter = document.getElementById('thiefCounter');
        const rankBadge = document.getElementById('rankBadge');
        const thiefScene = document.getElementById('thiefScene');
        const arrestBadge = document.getElementById('arrestBadge');
        const exerciseCard = document.getElementById('exerciseCard');

        function displayProblem(prob) {
            state.currentProblem = prob;
            numAEl.textContent = prob.num1;
            numBEl.textContent = prob.num2;
            operationSignEl.textContent = prob.symbol;
            answerInput.value = '';
            
            const randomThief = THIEF_EMOJIS[Math.floor(Math.random() * THIEF_EMOJIS.length)];
            thiefScene.textContent = randomThief;
            thiefScene.className = "robber-sneak-anim text-5xl select-none transition-transform";
            arrestBadge.classList.add('hidden');
            exerciseCard.classList.remove('beacon-active');

            feedbackText.innerHTML = `<span class="text-blue-200">Zastav lupiče kódem:</span>`;
            state.isLocked = false;
        }

        function updateStatsUI() {
            const pct = state.totalSolved > 0 ? Math.round((state.correctCount / state.totalSolved) * 100) : 100;
            scoreDisplay.textContent = `${state.correctCount}/${state.totalSolved} (${pct}%)`;
            thiefCounter.textContent = `🚨 ${state.streak}`;

            let currentRank = POLICE_RANKS[0];
            for (const r of POLICE_RANKS) {
                if (state.streak >= r.min) currentRank = r;
            }
            const oldRank = rankBadge.textContent.trim();
            const newRankString = `${currentRank.icon} ${currentRank.title}`;
            rankBadge.textContent = newRankString;

            if (oldRank !== newRankString && state.streak > 0) {
                playPromotionFanfare();
                feedbackText.innerHTML = `<span class="text-yellow-300 font-extrabold animate-bounce">🎖️ POVÝŠENÍ: ${currentRank.title}!</span>`;
            }
        }

        function checkAnswer() {
            if (state.isLocked) return;
            const val = answerInput.value.trim();
            if (val === '') return;
            const userNum = parseInt(val, 10);
            if (isNaN(userNum)) return;

            state.isLocked = true;
            state.totalSolved++;

            if (userNum === state.currentProblem.answer) {
                state.correctCount++;
                state.streak++;
                playArrestSound();

                thiefScene.textContent = "⛓️🦹‍♂️👮‍♂️";
                thiefScene.className = "text-5xl scale-110 transition-transform duration-200";
                arrestBadge.classList.remove('hidden');
                exerciseCard.classList.add('beacon-active', 'ring-4', 'ring-emerald-500/80');

                feedbackText.innerHTML = `<span class="text-emerald-400 font-bold">🚔 ZADRŽEN! Kód byl ${state.currentProblem.answer}!</span>`;
                updateStatsUI();

                setTimeout(() => {
                    exerciseCard.classList.remove('ring-4', 'ring-emerald-500/80');
                    state.lastProblem = state.currentProblem;
                    displayProblem(generateProblem());
                }, 1100);
            } else {
                state.streak = 0;
                playThiefEscapedSound();
                thiefScene.textContent = "💨🏃‍♂️💨";
                exerciseCard.classList.add('shake-anim', 'ring-4', 'ring-red-600');
                feedbackText.innerHTML = `<span class="text-rose-400 font-bold">⚠️ Unikl! Správně bylo <span class="text-yellow-300 font-black text-base underline ml-1">${state.currentProblem.answer}</span></span>`;
                updateStatsUI();

                setTimeout(() => {
                    exerciseCard.classList.remove('shake-anim', 'ring-4', 'ring-red-600');
                    state.lastProblem = state.currentProblem;
                    displayProblem(generateProblem());
                }, 1900);
            }
        }

        // Fyzická klávesnice
        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key >= '0' && e.key <= '9') {
                if (!state.isLocked && answerInput.value.length < 4) answerInput.value += e.key;
            } else if (e.key === 'Backspace') {
                if (!state.isLocked) answerInput.value = answerInput.value.slice(0, -1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                checkAnswer();
            }
        });

        // Numpad
        document.querySelectorAll('.numpad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                initAudio();
                if (state.isLocked) return;
                if (answerInput.value.length < 4) answerInput.value += btn.getAttribute('data-key');
            });
        });
        document.getElementById('backspaceBtn').addEventListener('click', () => {
            initAudio();
            if (!state.isLocked) answerInput.value = answerInput.value.slice(0, -1);
        });
        document.getElementById('submitBtn').addEventListener('click', () => {
            initAudio();
            checkAnswer();
        });

        const opBtns = { multiply: document.getElementById('opMultiply'), divide: document.getElementById('opDivide'), mixed: document.getElementById('opMixed') };
        function setMode(m) {
            state.mode = m;
            Object.keys(opBtns).forEach(k => {
                opBtns[k].className = k === m ? "op-btn px-2.5 py-1 rounded bg-blue-600 text-white shadow font-bold" : "op-btn px-2.5 py-1 rounded text-slate-400";
            });
            displayProblem(generateProblem());
        }
        opBtns.multiply.onclick = () => setMode('multiply');
        opBtns.divide.onclick = () => setMode('divide');
        opBtns.mixed.onclick = () => setMode('mixed');

        const numToggleBtns = document.querySelectorAll('.num-toggle');
        function updateNumberButtons() {
            numToggleBtns.forEach(btn => {
                const n = parseInt(btn.getAttribute('data-num'), 10);
                btn.className = state.selectedNumbers.has(n)
                    ? "num-toggle py-1 rounded font-bold text-xs bg-blue-600 text-white border border-yellow-400"
                    : "num-toggle py-1 rounded font-bold text-xs bg-slate-800 text-slate-400 border border-slate-700";
            });
        }
        numToggleBtns.forEach(btn => {
            btn.onclick = () => {
                const n = parseInt(btn.getAttribute('data-num'), 10);
                if (state.selectedNumbers.has(n)) {
                    if (state.selectedNumbers.size > 1) state.selectedNumbers.delete(n);
                } else {
                    state.selectedNumbers.add(n);
                }
                updateNumberButtons();
                displayProblem(generateProblem());
            };
        });

        document.getElementById('selectAllBtn').onclick = () => {
            for (let i = 1; i <= 10; i++) state.selectedNumbers.add(i);
            updateNumberButtons();
            displayProblem(generateProblem());
        };
        document.getElementById('selectBasicBtn').onclick = () => {
            state.selectedNumbers.clear();
            [2, 3, 4, 5].forEach(n => state.selectedNumbers.add(n));
            updateNumberButtons();
            displayProblem(generateProblem());
        };

        const soundToggle = document.getElementById('soundToggle');
        soundToggle.onclick = () => {
            state.soundEnabled = !state.soundEnabled;
            document.getElementById('soundIcon').textContent = state.soundEnabled ? '🔊' : '🔇';
            if (state.soundEnabled) initAudio();
        };

        window.onload = () => {
            updateNumberButtons();
            updateStatsUI();
            displayProblem(generateProblem());
        };
    </script>
</body>
</html>
